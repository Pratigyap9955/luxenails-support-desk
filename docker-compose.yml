version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: luxenails-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxenails
      POSTGRES_PASSWORD: luxenails
      POSTGRES_DB: luxenails
    ports:
      - "5432:5432"
    volumes:
      - luxenails_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxenails -d luxenails"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luxenails_pgdata:
